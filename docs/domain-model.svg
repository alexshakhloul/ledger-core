<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Domain model: a Ledger owns one Account and composes many immutable LedgerEntry records, each carrying a Money amount and an EntryType, and optionally referencing another entry it reverses. Authorizations are associated with an Account but are not owned by its ledger.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="dOpen" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 1 6 L 6 3 L 11 6 L 6 9 z" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/>
    </marker>
    <marker id="dFill" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 1 6 L 6 3 L 11 6 L 6 9 z" fill="#57606a"/>
    </marker>
  </defs>

  <style>
    .box  { fill:#ffffff; stroke:#57606a; stroke-width:1.5; }
    .hdr  { fill:#f6f8fa; stroke:none; }
    .div  { stroke:#57606a; stroke-width:1; }
    .cls  { font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill:#1f2328; }
    .ste  { font:400 11px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill:#8250df; }
    .fld  { font:400 11.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#1f2328; }
    .rel  { stroke:#57606a; stroke-width:1.5; fill:none; }
    .reld { stroke:#8250df; stroke-width:1.5; fill:none; stroke-dasharray:5 4; }
    .lbl  { font:400 11px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill:#57606a; }
    .lblp { font:400 11px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill:#8250df; }
    .card { font:400 10.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill:#57606a; }
  </style>

  <rect width="1000" height="600" fill="#ffffff"/>

  <rect class="box" x="40" y="40" width="280" height="96" rx="4"/>
  <path class="hdr" d="M 41 41 h 278 v 27 h -278 z"/>
  <line class="div" x1="41" y1="68" x2="319" y2="68"/>
  <text class="cls" x="180" y="60" text-anchor="middle">Account</text>
  <text class="fld" x="54" y="87">+ id: AccountId</text>
  <text class="fld" x="54" y="105">+ currency: Currency</text>
  <text class="fld" x="54" y="123">+ openingBalance: Money</text>

  <rect class="box" x="690" y="40" width="260" height="132" rx="4"/>
  <path class="hdr" d="M 691 41 h 258 v 27 h -258 z"/>
  <line class="div" x1="691" y1="68" x2="949" y2="68"/>
  <text class="cls" x="820" y="60" text-anchor="middle">Authorization</text>
  <text class="fld" x="704" y="87">+ id: AuthorizationId</text>
  <text class="fld" x="704" y="105">+ accountId: AccountId</text>
  <text class="fld" x="704" y="123">+ amount: Money</text>
  <text class="fld" x="704" y="141">+ bookedOn: Day</text>
  <text class="fld" x="704" y="159">+ status: AuthorizationStatus</text>

  <rect class="box" x="40" y="200" width="300" height="152" rx="4"/>
  <path class="hdr" d="M 41 201 h 298 v 27 h -298 z"/>
  <line class="div" x1="41" y1="228" x2="339" y2="228"/>
  <text class="cls" x="190" y="220" text-anchor="middle">Ledger</text>
  <text class="fld" x="54" y="247">- postedEntries: List</text>
  <text class="fld" x="54" y="265">- dailyTotals: by day and type</text>
  <line class="div" x1="41" y1="278" x2="339" y2="278"/>
  <text class="fld" x="54" y="297">+ append(...): LedgerEntry</text>
  <text class="fld" x="54" y="315">+ closingBalance(day, excl)</text>
  <text class="fld" x="54" y="333">+ entry(entryId): LedgerEntry?</text>

  <rect class="box" x="390" y="200" width="270" height="190" rx="4"/>
  <path class="hdr" d="M 391 201 h 268 v 27 h -268 z"/>
  <line class="div" x1="391" y1="228" x2="659" y2="228"/>
  <text class="cls" x="525" y="220" text-anchor="middle">LedgerEntry</text>
  <text class="fld" x="404" y="247">+ entryId: EntryId</text>
  <text class="fld" x="404" y="265">+ accountId: AccountId</text>
  <text class="fld" x="404" y="283">+ type: EntryType</text>
  <text class="fld" x="404" y="301">+ amount: Money</text>
  <text class="fld" x="404" y="319">+ valueDate: Day</text>
  <text class="fld" x="404" y="337">+ sourceEventId: EventId?</text>
  <text class="fld" x="404" y="355">+ reversalOf: EntryId?</text>
  <line class="div" x1="391" y1="366" x2="659" y2="366"/>
  <text class="fld" x="404" y="382">+ signedAmount: Money</text>

  <rect class="box" x="690" y="230" width="260" height="112" rx="4"/>
  <path class="hdr" d="M 691 231 h 258 v 27 h -258 z"/>
  <line class="div" x1="691" y1="258" x2="949" y2="258"/>
  <text class="cls" x="820" y="250" text-anchor="middle">AuthorizationStatus</text>
  <text class="ste" x="704" y="276">&#171;enumeration&#187;</text>
  <text class="fld" x="704" y="295">APPROVED</text>
  <text class="fld" x="704" y="313">REJECTED</text>
  <text class="fld" x="704" y="331">SETTLED</text>

  <rect class="box" x="690" y="400" width="260" height="112" rx="4"/>
  <path class="hdr" d="M 691 401 h 258 v 27 h -258 z"/>
  <line class="div" x1="691" y1="428" x2="949" y2="428"/>
  <text class="cls" x="820" y="420" text-anchor="middle">Money</text>
  <text class="fld" x="704" y="447">+ currency: Currency</text>
  <text class="fld" x="704" y="465">+ minor: Long</text>
  <line class="div" x1="691" y1="476" x2="949" y2="476"/>
  <text class="fld" x="704" y="494">+ of(currency, decimal)</text>

  <rect class="box" x="390" y="450" width="270" height="130" rx="4"/>
  <path class="hdr" d="M 391 451 h 268 v 27 h -268 z"/>
  <line class="div" x1="391" y1="478" x2="659" y2="478"/>
  <text class="cls" x="525" y="470" text-anchor="middle">EntryType</text>
  <text class="ste" x="404" y="496">&#171;enumeration&#187;</text>
  <text class="fld" x="404" y="515">CREDIT</text>
  <text class="fld" x="404" y="533">DEBIT</text>
  <text class="fld" x="404" y="551">OVERDRAFT_FEE</text>
  <text class="fld" x="404" y="569">INTEREST_CAPITALIZATION</text>

  <path class="rel" d="M 120 200 V 136" marker-start="url(#dOpen)" marker-end="url(#ar)"/>
  <text class="lbl" x="130" y="170">owns</text>
  <text class="card" x="130" y="192">1</text>

  <path class="rel" d="M 340 270 H 390" marker-start="url(#dFill)" marker-end="url(#ar)"/>
  <text class="lbl" x="365" y="254" text-anchor="middle">holds</text>
  <text class="card" x="384" y="288" text-anchor="end">0..*</text>

  <path class="rel" d="M 525 390 V 450" marker-end="url(#ar)"/>
  <text class="lbl" x="533" y="424">type</text>

  <path class="rel" d="M 620 390 V 440 H 690" marker-end="url(#ar)"/>
  <text class="lbl" x="634" y="432">amount</text>

  <path class="rel" d="M 820 172 V 230" marker-end="url(#ar)"/>
  <text class="lbl" x="828" y="206">status</text>

  <path class="rel" d="M 950 106 H 976 V 456 H 950" marker-end="url(#ar)"/>
  <text class="lbl" x="968" y="290" text-anchor="middle" transform="rotate(-90 968 290)">amount</text>

  <path class="rel" d="M 450 200 V 176 H 600 V 200" marker-end="url(#ar)"/>
  <text class="lbl" x="525" y="169" text-anchor="middle">reversalOf</text>

  <path class="reld" d="M 320 92 H 690"/>
  <text class="lblp" x="505" y="84" text-anchor="middle">holds against, but outside the ledger</text>
  <text class="card" x="682" y="108" text-anchor="end">0..*</text>
</svg>
